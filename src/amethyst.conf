# tatami as Amethyst: Amethyst's layouts and its default shortcuts.
#
#   tatami default-config amethyst > ~/.config/tatami/tatami.conf
#
# mod1 is option-shift, mod2 is ctrl-option-shift, as in Amethyst. Every display shows a
# workspace of its own, and every workspace has its own layout, main pane count and main
# pane size, so each screen is laid out on its own. Screens are numbered left to right.
#
# Amethyst's layouts, in the order that mod1-space goes through them:
#   tall            the main pane on the left, the others in rows on the right
#   wide            the main pane on top, the others in columns below
#   fullscreen      every window fills the screen; mod1-j and mod1-k go through them
#   column          one column per window
# Also available, for this list or a 'layout' binding: tall-right, two-pane, 3column-left,
# 3column-middle (middle-wide), 3column-right, widescreen-tall, row, and bsp, tatami's own
# tree.

layouts tall wide fullscreen column
spaces native

gap inner 0
gap outer 0
gap toggle 10

border width 3
border radius 12
border color 4c7899

# Layouts
bind alt-shift-space : layout next
bind ctrl-alt-shift-space : layout prev
bind alt-shift-a : layout tall
bind alt-shift-s : layout wide
bind alt-shift-d : layout fullscreen
bind alt-shift-f : layout column

# The main pane
bind alt-shift-h : main shrink
bind alt-shift-l : main expand
bind alt-shift-comma : main more
bind alt-shift-period : main fewer
bind alt-shift-enter : main swap

# Windows: focus and swap go around the layout order. Counter clockwise (j) is the window
# before, clockwise (k) the one after, as in Amethyst.
bind alt-shift-j : focus prev --wrap
bind alt-shift-k : focus next --wrap
bind ctrl-alt-shift-j : swap prev
bind ctrl-alt-shift-k : swap next
bind alt-shift-m : main focus
bind alt-shift-t : toggle float

# Screens
bind alt-shift-p : focus-monitor prev
bind alt-shift-n : focus-monitor next
bind ctrl-alt-shift-h : send-monitor prev --follow
bind ctrl-alt-shift-l : send-monitor next --follow
bind alt-shift-w : focus-monitor 1
bind alt-shift-e : focus-monitor 2
bind alt-shift-r : focus-monitor 3
bind alt-shift-q : focus-monitor 4
bind alt-shift-g : focus-monitor 5
bind ctrl-alt-shift-w : send-monitor 1 --follow
bind ctrl-alt-shift-e : send-monitor 2 --follow
bind ctrl-alt-shift-r : send-monitor 3 --follow
bind ctrl-alt-shift-q : send-monitor 4 --follow
bind ctrl-alt-shift-g : send-monitor 5 --follow

# Spaces. Every macOS Space (desktop) is a workspace with a layout of its own, as in
# Amethyst. Switch Spaces as you always do; mod2 and a number throws the focused window to
# that desktop and follows it there, by holding it while Mission Control's "Switch to
# Desktop N" shortcut is pressed (turned on if it was off, as Amethyst does). So do not
# bind those shortcuts (ctrl-1 to ctrl-9 by default) here.
bind ctrl-alt-shift-left : send prev --follow
bind ctrl-alt-shift-right : send next --follow
bind ctrl-alt-shift-1 : send 1 --follow
bind ctrl-alt-shift-2 : send 2 --follow
bind ctrl-alt-shift-3 : send 3 --follow
bind ctrl-alt-shift-4 : send 4 --follow
bind ctrl-alt-shift-5 : send 5 --follow
bind ctrl-alt-shift-6 : send 6 --follow
bind ctrl-alt-shift-7 : send 7 --follow
bind ctrl-alt-shift-8 : send 8 --follow
bind ctrl-alt-shift-9 : send 9 --follow
bind ctrl-alt-shift-0 : send 10 --follow

# Reevaluate windows, and relaunch (read the configuration again)
bind alt-shift-z : retile
bind ctrl-alt-shift-z : reload

# Windows that float, as Amethyst's defaults leave them alone
rule app="System Settings" : float
rule app="System Preferences" : float
rule app="System Information" : float
rule app="Archive Utility" : float
rule app="Installer" : float
rule app="Calculator" : float
rule app="Dictionary" : float
rule app="Digital Color Meter" : float
rule app="Raycast" : float
rule app="Alfred" : float
rule app="1Password" : float
